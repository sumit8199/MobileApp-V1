<app-header></app-header>

<ion-content>
  <!-- Pull-to-refresh to fetch latest patients directly from GET /api/patients -->
  <ion-refresher slot="fixed" (ionRefresh)="fetchPatients($event)">
    <ion-refresher-content pullingText="Pull to refresh patients..." refreshingSpinner="circles">
    </ion-refresher-content>
  </ion-refresher>

  @if (isFormOpen()) {
  <!-- Deferrable View: Lazy-loads Add/Edit Patient Form on demand -->
  @defer (when isFormOpen()) {
  <app-add-patient [patient]="selectedPatientForEdit()" [nextPushya]="nextPushyaDate()" (closeForm)="closeForm()"
    (patientSaved)="onPatientSaved($event)"></app-add-patient>
  }
  } @else {
  <!-- Patient Directory with GET, Edit, Delete, Search & Server Pagination integration -->
  <app-patient-directory
    [patients]="patients()"
    [totalCount]="totalPatients()"
    [nextPushya]="nextPushyaDate()"
    [search]="searchQuery()"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [totalPages]="totalPages()"
    (searchChange)="onSearchChange($event)"
    (pageChange)="onPageChange($event)"
    (openAddForm)="openAddForm()"
    (editPatient)="openEditForm($event)"
    (deletePatient)="handleDeletePatient($event)">
  </app-patient-directory>
  }

  <!-- Floating Action Button for quick Add Patient -->
  @if (!isFormOpen()) {
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="openAddForm()" color="primary" aria-label="Register new patient">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
  }
</ion-content>
