<app-header></app-header>

<ion-content>
  <div class="dashboard">
    <div class="card-grid">
      <app-card [icon]="peopleOutline" label="Total Patients" [value]="patients().length.toString()">
      </app-card>

      <app-card
        [icon]="starOutline"
        label="Days to Pushya"
        [value]="daysToPushya()"
        [gold]="true"
      >
      </app-card>

      <app-card [icon]="checkmarkDoneOutline" label="Messages Read" [value]="messagesReadDisplay()">
      </app-card>

      <app-card
        [icon]="calendarClearOutline"
        label="Next Session"
        [value]="nextSessionDisplay()"
      >
      </app-card>
    </div>
    
    <!-- Deferrable View: Lazy loads schedule lists on idle -->
    @defer (on idle) {
      <app-schedule-section
        [stage]="1"
        label="Pre-Notification · Stage 1"
        [fireDate]="stage1Date()"
        [pushyaDate]="nextPushya()"
        [patients]="patients()"
      >
      </app-schedule-section>

      <app-schedule-section
        [stage]="2"
        label="Day-of Notification · Stage 2"
        [fireDate]="nextPushya()"
        [pushyaDate]="nextPushya()"
        [patients]="patients()"
      >
      </app-schedule-section>
    }
  </div>
</ion-content>
