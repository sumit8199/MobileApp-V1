<ion-header translucent="true">
  <ion-toolbar class="custom-toolbar">
    <div class="header-content">

      <div class="brand">
        <div class="logo-box">
          <ion-icon name="leaf-outline"></ion-icon>
        </div>

        <div class="brand-text">
          <h1>SuvarnaCare</h1>
          <p>Ayurvedic Child Wellness</p>
        </div>
      </div>

      <div class="header-right">
        <!-- Live Localhost Service & SQL Status Pill -->
        <div class="db-status-pill" [class.connected]="dbStatus().sqlServerConnected" title="SQL Server & Microservices Status on Localhost">
          <span class="status-pulse"></span>
          <span class="status-text">
            {{ dbStatus().sqlServerConnected ? 'SQL Active' : 'Local Dev' }}
          </span>
        </div>

        <!-- Doctor Avatar & Logout -->
        @if (currentUser()) {
          <div class="doctor-badge" (click)="navigateToSettings()" title="View Doctor Profile (Settings)">
            <span class="doctor-initials">{{ currentUser()?.initials || 'DR' }}</span>
          </div>

          <ion-button fill="clear" class="logout-icon-btn" (click)="logout()" title="Sign Out">
            <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
          </ion-button>
        } @else {
          <ion-button fill="clear" class="notification-btn">
            <ion-icon slot="icon-only" name="notifications-outline"></ion-icon>
            <span class="badge">3</span>
          </ion-button>
        }
      </div>

    </div>
  </ion-toolbar>
</ion-header>
